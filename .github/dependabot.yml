version: 2
updates:
  # pnpm workspace: root package.json + pnpm-lock.yaml cover apps/* and packages/*
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    ignore:
      # Types track the minimum supported Node (engines: >=24); bump together with Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # svelte-check doesn't support TypeScript 7 on its own yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Base images in docker/Dockerfile (tag + digest pins)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      # Stay on the Node LTS line used in CI; Node 26 also drops corepack, which the Dockerfile uses
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Workflow actions (pinned to commit SHAs)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
